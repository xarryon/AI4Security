name: Unpack team publications site

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/unpack-site.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract site files
        shell: bash
        run: |
          rm -rf .unpacked
          unzip -q team-publications-github.zip -d .unpacked
          cp -a .unpacked/team-publications/. .
          rm -rf .unpacked
          rm -f .github/workflows/pages.yml

      - name: Commit extracted site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack team publications site"
          git push
